name: Build Tariq Al-Halal Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare signing keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
              echo "Restored app/google-services.json from GitHub Secret."
            else
              echo "ERROR: app/google-services.json is missing."
              echo "Add a repository secret named GOOGLE_SERVICES_JSON (containing app/google-services.json) in GitHub Settings -> Secrets and variables -> Actions, or upload app/google-services.json into the app/ folder of your private repo."
              exit 1
            fi
          fi

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk TariqAlHalal.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TariqAlHalal-APK
          path: TariqAlHalal.apk
          retention-days: 30

      - name: Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "طريق الحلال — أحدث نسخة APK"
          body: "اضغط على ملف TariqAlHalal.apk بالأسفل لتحميل التطبيق مباشرة على موبايل الأندرويد."
          files: TariqAlHalal.apk
          make_latest: true
